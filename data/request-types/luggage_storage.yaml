id: luggage_storage
version: 1
label:
  ko: 체크아웃 후 짐 맡기기
  en: Luggage storage after check-out
  ja: チェックアウト後の荷物預かり
  zh-CN: 退房后寄存行李
  zh-TW: 退房後寄放行李
  vi: Gửi hành lý sau khi trả phòng
  th: ฝากกระเป๋าหลังเช็กเอาต์
  id: Titip koper setelah check-out
  es: Dejar las maletas tras el check-out
journey_stage: departure
execution_level: 대행
target: stay
required_slots:
  - key: stay_name
    from_board: stays[target].name
    ask:
      en: "Which hotel?"
      ja: "どのホテルですか？"
      zh-CN: "哪家酒店？"
      zh-TW: "哪一家飯店？"
      vi: "Khách sạn nào?"
      th: "พักโรงแรมไหน?"
      id: "Hotel yang mana?"
      es: "¿Qué hotel?"
      ko: "어느 숙소예요?"
  - key: guest_name
    from_board: stays[target].guest_name
    ask:
      en: "What name is the booking under?"
      ja: "予約は誰の名前で入っていますか？"
      zh-CN: "预订人姓名是什么？"
      zh-TW: "訂房人姓名是什麼？"
      vi: "Phòng được đặt dưới tên ai?"
      th: "จองไว้ในชื่อใคร?"
      id: "Pemesanan atas nama siapa?"
      es: "¿A nombre de quién está la reserva?"
      ko: "누구 이름으로 예약했어요?"
  - key: booking_ref
    from_board: stays[target].booking_ref
    ask:
      en: "What is your booking number?"
      ja: "予約番号を教えてください。"
      zh-CN: "你的预订号是多少？"
      zh-TW: "你的訂房編號是多少？"
      vi: "Mã đặt phòng của bạn là gì?"
      th: "หมายเลขการจองของคุณคืออะไร"
      id: "Berapa nomor pemesananmu?"
      es: "¿Cuál es tu número de reserva?"
      ko: "예약번호를 알려 주세요."
  - key: check_out_date
    from_board: stays[target].check_out_date
    ask:
      en: "What is your check-out date?"
      ja: "チェックアウト日はいつですか？"
      zh-CN: "哪天退房？"
      zh-TW: "哪一天退房？"
      vi: "Bạn trả phòng ngày nào?"
      th: "เช็กเอาต์วันไหน?"
      id: "Check-out tanggal berapa?"
      es: "¿Qué día haces el check-out?"
      ko: "체크아웃은 며칠이에요?"
  - key: pickup_time
    ask:
      en: "Until what time do you need to leave your bags?"
      ja: "何時まで荷物を預けたいですか？"
      zh-CN: "你需要把行李寄存到几点？"
      zh-TW: "你需要把行李寄放到幾點？"
      vi: "Bạn cần gửi hành lý đến mấy giờ?"
      th: "อยากฝากกระเป๋าถึงกี่โมง?"
      id: "Mau titip koper sampai jam berapa?"
      es: "¿Hasta qué hora necesitas dejar el equipaje?"
      ko: "짐은 몇 시까지 맡기고 싶어요?"
  - key: bag_count
    ask:
      en: "How many bags?"
      ja: "荷物はいくつですか？"
      zh-CN: "有几件行李？"
      zh-TW: "有幾件行李？"
      vi: "Bạn có mấy túi hành lý?"
      th: "มีกระเป๋ากี่ใบ?"
      id: "Ada berapa koper?"
      es: "¿Cuántas maletas?"
      ko: "짐은 몇 개예요?"
optional_slots: [bag_size]
channels:
  - { type: email, requires: [stay_email] }
  - { type: phone, requires: [stay_phone] }
channel_rule:
  deadline_slot: check_out_date
  phone_within_hours: 6
message_guidelines:
  tone: 정중한 합쇼체
  must_include: [예약자명, 예약번호, 체크아웃 날짜, 짐 개수, 찾아갈 시각, 보관 가능 여부와 요금]
  must_not_include: [여권번호, 카드번호]
  max_chars: 500
reply_hints:
  conditional: [유료 보관, 보관 시간 제한, 귀중품 보관 불가]
  declined: [보관 공간 없음]
  info_requested: [짐 크기, 찾아갈 정확한 시각]
follow_ups:
  on_conditional: 요금·시간 조건을 설명하고 수락 여부를 묻는다
  on_info_requested: 요구 정보를 이용자에게 묻고 후속 요청문을 만든다
  on_declined: [ask_user_for_alternative]
